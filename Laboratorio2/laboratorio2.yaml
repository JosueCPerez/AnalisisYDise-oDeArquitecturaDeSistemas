  # ─── LOAD BALANCER ────────────────────────────────────────────────────────

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: LabAltaDisponibilidadALB
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      Tags:
        - Key: Name
          Value: LabAltaDisponibilidadALB

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: LabAltaDispTG
      Port: 80
      Protocol: HTTP
      VpcId: !Ref LabVPC
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: 200
      Targets:
        - Id: !Ref WebServerA
          Port: 80
        - Id: !Ref WebServerB
          Port: 80
        - Id: !Ref WebServerC
          Port: 80
        - Id: !Ref WebServerD
          Port: 80
        - Id: !Ref WebServerE
          Port: 80

  LoadBalancerListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

# ─── OUTPUTS ──────────────────────────────────────────────────────────────

Outputs:
  LoadBalancerDNS:
    Description: "DNS publico del Load Balancer"
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  WebsiteURL:
    Description: "URL del sitio web"
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"

  InstanceAId:
    Description: "ID de la instancia A (AZ 1)"
    Value: !Ref WebServerA

  InstanceBId:
    Description: "ID de la instancia B (AZ 2)"
    Value: !Ref WebServerB

  InstanceCId:
    Description: "ID de la instancia C (AZ 1)"
    Value: !Ref WebServerC

  InstanceDId:
    Description: "ID de la instancia D (AZ 2)"
    Value: !Ref WebServerD

  InstanceEId:
    Description: "ID de la instancia E (AZ 1)"
    Value: !Ref WebServerE
